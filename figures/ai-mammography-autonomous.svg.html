<figure class="fig">
<svg viewBox="0 0 420 266" role="img" aria-labelledby="fig-ai-mammography-autonomous-t fig-ai-mammography-autonomous-d">
<title id="fig-ai-mammography-autonomous-t">Workload, detection and recall</title>
<desc id="fig-ai-mammography-autonomous-d">Radiologist workload fell 63.6 percent, detection rose from 6.3 to 7.3 cancers per 1,000 examinations, and recall rose 14.8 percent relative to standard screening.</desc>
<rect class="panel" x="1" y="1" width="418" height="264" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">Workload, detection and recall</text>
<rect class="b" x="20" y="56" width="62" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="12" font-weight="700">−63.6%</text>
<text class="tm" x="200" y="83" font-size="12.5">radiologist workload</text>
<rect class="b" x="20" y="114" width="54" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="12" font-weight="700">6.3 → 7.3</text>
<text class="tm" x="200" y="141" font-size="12.5">cancers per 1,000</text>
<rect class="b" x="20" y="172" width="89" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="12" font-weight="700">+14.8%</text>
<text class="tm" x="200" y="199" font-size="12.5">recall rate, relative</text>
</svg>
<figcaption>Workload fell sharply while detection and recall both rose. (Elías-Cabot et al.)</figcaption>
</figure>
