<figure class="fig">
<svg viewBox="0 0 420 324" role="img" aria-labelledby="fig-robotic-surgery-t fig-robotic-surgery-d">
<title id="fig-robotic-surgery-t">The cost and reach of robotic surgery</title>
<desc id="fig-robotic-surgery-d">Robotic surgery has been in use since 2000, is found in roughly 70 percent of major U.S. hospitals, costs about 2 million dollars to buy, and more than 100,000 dollars a year to maintain.</desc>
<rect class="panel" x="1" y="1" width="418" height="322" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">The cost and reach of robotic surgery</text>
<rect class="b" x="20" y="56" width="91" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="13" font-weight="700">SINCE 2000</text>
<text class="tm" x="190" y="83" font-size="12.5">in use</text>
<rect class="b" x="20" y="114" width="50" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="13" font-weight="700">ROUGHLY 70%</text>
<text class="tm" x="190" y="141" font-size="12.5">of major US hospitals</text>
<rect class="b" x="20" y="172" width="21" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="13" font-weight="700">ABOUT $2 MILLION</text>
<text class="tm" x="190" y="199" font-size="12.5">to purchase</text>
<rect class="b" x="20" y="230" width="13" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="257" font-size="13" font-weight="700">OVER $100,000</text>
<text class="tm" x="190" y="257" font-size="12.5">a year to maintain</text>
</svg>
<figcaption>Robotic systems are common and expensive.</figcaption>
</figure>
