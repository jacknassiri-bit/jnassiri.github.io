<figure class="fig">
<svg viewBox="0 0 420 266" role="img" aria-labelledby="fig-ai-heart-attack-prediction-t fig-ai-heart-attack-prediction-d">
<title id="fig-ai-heart-attack-prediction-t">A risk score needs an action</title>
<desc id="fig-ai-heart-attack-prediction-d">A useful risk score leads to one named next step, such as treating LDL, managing blood pressure or ordering the follow-up scan; a score with no plan is a dead end.</desc>
<rect class="panel" x="1" y="1" width="418" height="264" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">A risk score needs an action</text>
<rect class="b" x="20" y="56" width="50" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="13" font-weight="700">RISK SCORE</text>
<text class="tm" x="190" y="83" font-size="12.5">treat LDL</text>
<rect class="b" x="20" y="114" width="29" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="13" font-weight="700">NEXT STEP</text>
<text class="tm" x="190" y="141" font-size="12.5">manage blood pressure</text>
<text class="tm" x="190" y="158" font-size="12.5">order the follow-up scan</text>
<rect class="b" x="20" y="172" width="71" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="13" font-weight="700">DEAD END</text>
<text class="tm" x="190" y="199" font-size="12.5">score with no plan</text>
</svg>
<figcaption>Schematic: A risk score is useful when it leads to a specific clinical action.</figcaption>
</figure>
