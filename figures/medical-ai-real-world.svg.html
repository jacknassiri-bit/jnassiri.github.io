<title id="fig-medical-ai-real-world-t">Did the AI result reach the patient?</title>
<desc id="fig-medical-ai-real-world-d">Across four clinical studies, two systems changed workflow or detection while two did not change the measured patient pathway.</desc>
<rect class="panel" x="1" y="1" width="418" height="322" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">Did the AI result reach the patient?</text>
<rect class="b" x="20" y="56" width="76" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="12" font-weight="700">Kenya LLM · 9,691 patients</text>
<text class="tm" x="200" y="74.5" font-size="12.5">2.2% AI vs 2.0% control · NO</text>
<text class="tm" x="200" y="91.5" font-size="12.5">CHANGE</text>
<rect class="b" x="20" y="114" width="29" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="12" font-weight="700">LungIMPACT · 93,326 X-rays</text>
<text class="tm" x="200" y="132.5" font-size="12.5">CT 53 vs 53 days · diagnosis</text>
<text class="tm" x="200" y="149.5" font-size="12.5">44 vs 46 days · NO CHANGE</text>
<rect class="b" x="20" y="172" width="44" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="12" font-weight="700">Spain mammography · 31,301 women</text>
<text class="tm" x="200" y="182" font-size="12.5">workload −63.6% · detection</text>
<text class="tm" x="200" y="199" font-size="12.5">6.3 to 7.3 per 1,000 ·</text>
<text class="tm" x="200" y="216" font-size="12.5">CHANGED</text>
<rect class="b" x="20" y="230" width="73" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="257" font-size="12" font-weight="700">LiON · 10,333 patients</text>
<text class="tm" x="200" y="248.5" font-size="12.5">51 lesions · 15 malignancies</text>
<text class="tm" x="200" y="265.5" font-size="12.5">· CHANGED</text>
</svg>
<figcaption>The result reached the workflow in two of the four studies. (Agweyu et al.; Woznitza et al.; Elías-Cabot et al.; Kuo et al.)</figcaption>
