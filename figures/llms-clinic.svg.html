<figure class="fig">
<svg viewBox="0 0 420 208" role="img" aria-labelledby="fig-llms-clinic-t fig-llms-clinic-d">
<title id="fig-llms-clinic-t">A safer division of work</title>
<desc id="fig-llms-clinic-d">The model can retrieve, organize, suggest and draft; the clinician keeps the final diagnosis, doses, treatment choice and patient explanation.</desc>
<rect class="panel" x="1" y="1" width="418" height="206" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">A safer division of work</text>
<rect class="b" x="20" y="56" width="58" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="12" font-weight="700">LET THE MODEL</text>
<text class="tm" x="200" y="66" font-size="12.5">retrieve a guideline ·</text>
<text class="tm" x="200" y="83" font-size="12.5">organize a chart · suggest</text>
<text class="tm" x="200" y="100" font-size="12.5">questions · draft a note</text>
<rect class="b" x="20" y="114" width="75" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="12" font-weight="700">KEEP WITH THE CLINICIAN</text>
<text class="tm" x="200" y="124" font-size="12.5">final diagnosis · medication</text>
<text class="tm" x="200" y="141" font-size="12.5">doses · treatment choice ·</text>
<text class="tm" x="200" y="158" font-size="12.5">explain it to the patient</text>
</svg>
<figcaption>Schematic: The model prepares information while the clinician owns the medical decision.</figcaption>
</figure>
