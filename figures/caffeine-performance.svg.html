<figure class="fig">
<svg viewBox="0 0 420 266" role="img" aria-labelledby="fig-caffeine-performance-t fig-caffeine-performance-d">
<title id="fig-caffeine-performance-t">Caffeine before bed</title>
<desc id="fig-caffeine-performance-d">A 400 milligram dose reduced sleep when taken at bedtime, three hours before bed and even six hours before bed.</desc>
<rect class="panel" x="1" y="1" width="418" height="264" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">Caffeine before bed</text>
<rect class="p" x="20" y="56" width="84" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="12" font-weight="700">BEDTIME</text>
<text class="tm" x="200" y="83" font-size="12.5">400 mg</text>
<rect class="p" x="20" y="114" width="15" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="12" font-weight="700">3 h before</text>
<text class="tm" x="200" y="141" font-size="12.5">400 mg</text>
<rect class="p" x="20" y="172" width="11" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="12" font-weight="700">6 h before</text>
<text class="tm" x="200" y="199" font-size="12.5">even this one reduced sleep</text>
</svg>
<figcaption>A 400 mg dose still reduced sleep when taken six hours before bed. (Drake et al.)</figcaption>
</figure>
