<figure class="fig">
<svg viewBox="0 0 420 208" role="img" aria-labelledby="fig-ai-replacing-radiologists-t fig-ai-replacing-radiologists-d">
<title id="fig-ai-replacing-radiologists-t">How imaging work is divided</title>
<desc id="fig-ai-replacing-radiologists-d">AI can flag, prioritize, detect and draft; the radiologist compares prior images, uses history, decides what changes care and owns the report.</desc>
<rect class="panel" x="1" y="1" width="418" height="206" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">How imaging work is divided</text>
<rect class="b" x="20" y="56" width="90" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="12" font-weight="700">AI DOES TODAY</text>
<text class="tm" x="200" y="66" font-size="12.5">flag a stroke · prioritize a</text>
<text class="tm" x="200" y="83" font-size="12.5">chest X-ray · detect a lung</text>
<text class="tm" x="200" y="100" font-size="12.5">nodule · draft a report</text>
<rect class="b" x="20" y="114" width="56" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="12" font-weight="700">RADIOLOGIST STILL DOES</text>
<text class="tm" x="200" y="124" font-size="12.5">compare earlier images · use</text>
<text class="tm" x="200" y="141" font-size="12.5">history · decide what</text>
<text class="tm" x="200" y="158" font-size="12.5">changes care · own the report</text>
</svg>
<figcaption>Schematic: AI handles narrow imaging tasks while the radiologist owns the clinical reading.</figcaption>
</figure>
