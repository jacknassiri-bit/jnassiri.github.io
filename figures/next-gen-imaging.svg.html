<figure class="fig">
<svg viewBox="0 0 420 266" role="img" aria-labelledby="fig-next-gen-imaging-t fig-next-gen-imaging-d">
<title id="fig-next-gen-imaging-t">Diagnostic novice scans</title>
<desc id="fig-next-gen-imaging-d">In a 240-patient study, left ventricular size, function and pericardial effusion were diagnostic in 237 of 240 cases, or 98.75 percent; right ventricular size was diagnostic in 222 of 240, or 92.5 percent.</desc>
<rect class="panel" x="1" y="1" width="418" height="264" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">Diagnostic novice scans</text>
<rect class="b" x="20" y="56" width="90" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="12" font-weight="700" data-derived="237/240">237 of 240 · 98.75%</text>
<text class="tm" x="200" y="74.5" font-size="12.5">LV size, function and</text>
<text class="tm" x="200" y="91.5" font-size="12.5">pericardial effusion</text>
<rect class="b" x="20" y="114" width="44" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="12" font-weight="700" data-derived="222/240">222 of 240 · 92.5%</text>
<text class="tm" x="200" y="141" font-size="12.5">right ventricular size</text>
<rect class="b" x="20" y="172" width="36" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="12" font-weight="700">8 nurses</text>
<text class="tm" x="200" y="190.5" font-size="12.5">without prior</text>
<text class="tm" x="200" y="207.5" font-size="12.5">echocardiography experience</text>
</svg>
<figcaption>Novice scans were diagnostic in 237 of 240 and 222 of 240 cases for the listed measures. (Narula et al.)</figcaption>
</figure>
