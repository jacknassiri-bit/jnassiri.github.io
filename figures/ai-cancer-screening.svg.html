<text class="tm" x="200" y="83" font-size="12.5">reading workload</text>
<rect class="b" x="20" y="114" width="40" height="8" rx="4" opacity=".85"/>

<text class="tm" x="200" y="132.5" font-size="12.5">44% lower · at least as many</text>
