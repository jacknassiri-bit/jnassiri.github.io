<figure class="fig">
<svg viewBox="0 0 420 324" role="img" aria-labelledby="fig-beta-alanine-endurance-t fig-beta-alanine-endurance-d">
<title id="fig-beta-alanine-endurance-t">Where beta-alanine showed a signal</title>
<desc id="fig-beta-alanine-endurance-d">Studies under 60 seconds showed no clear benefit; effects were more consistent from 60 to 240 seconds, with the largest practical signal from 0.5 to 10 minutes and a median improvement around 2.85 percent.</desc>
<rect class="panel" x="1" y="1" width="418" height="322" rx="12"/>
<text class="t" x="20" y="30" font-size="15" font-weight="700">Where beta-alanine showed a signal</text>
<rect class="p" x="20" y="56" width="30" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="83" font-size="13" font-weight="700">under 60 s</text>
<text class="tm" x="190" y="83" font-size="12.5">no clear benefit</text>
<rect class="p" x="20" y="114" width="79" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="141" font-size="13" font-weight="700">60–240 s</text>
<text class="tm" x="190" y="141" font-size="12.5">improved more consistently</text>
<rect class="p" x="20" y="172" width="39" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="199" font-size="13" font-weight="700">0.5–10 min</text>
<text class="tm" x="190" y="199" font-size="12.5">largest practical signal</text>
<rect class="p" x="20" y="230" width="58" height="8" rx="4" opacity=".85"/>
<text class="t mono" x="20" y="257" font-size="13" font-weight="700">about 2.85%</text>
<text class="tm" x="190" y="257" font-size="12.5">median improvement</text>
</svg>
<figcaption>The clearest signal appeared in hard efforts lasting roughly one to several minutes. (Hobson et al.; Saunders et al.)</figcaption>
</figure>
